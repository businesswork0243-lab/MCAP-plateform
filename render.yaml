# render.yaml - Semantiq Backend API (Optimized for 100% Lifetime Free Plan)
services:
  # ──────────────────────────────────────────────────────────
  # Semantiq API + Internal Background Worker (Single Free Service)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: semantiq-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npx turbo run build --filter=@mcap/api
    startCommand: npm run start -w @mcap/api
    healthCheckPath: /health
    envVars:
      # Database from Neon.tech (Paste in Render Dashboard)
      - key: DATABASE_URL
        sync: false

      # Redis from Upstash (Paste in Render Dashboard)
      - key: REDIS_URL
        sync: false

      # AI Engine URL (From Hugging Face Spaces or Render)
      - key: AI_ENGINE_URL
        sync: false

      # Security & Tokens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: "production"

      # RUN_WORKERS=true embeds BullMQ worker inside the API
      # Saves free hours and avoids paid Render worker tier!
      - key: RUN_WORKERS
        value: "true"

      # Frontend Web URL (From Vercel)
      - key: WEB_URL
        value: "https://semantiq.vercel.app"

      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: LOG_LEVEL
        value: "info"
      - key: AI_TIMEOUT_MS
        value: "180000"
