name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

# A second push must not start a deploy while an earlier one is still
# reconfiguring the box.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/businesswork0243-lab/mcap

jobs:
  # Building on the EC2 box made every deploy take 10-40 minutes and timed
  # the SSH session out. GitHub's runner is far faster and has a persistent
  # layer cache, so images are built here and the box only pulls them.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push ai-engine
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-engine
          file: ./apps/ai-engine/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ai-engine:latest
            ${{ env.IMAGE_PREFIX }}-ai-engine:${{ github.sha }}
          cache-from: type=gha,scope=ai-engine
          cache-to: type=gha,mode=max,scope=ai-engine

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/mcap-platform
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker logout ghcr.io
            sudo docker image prune -f
            sudo docker compose ps
