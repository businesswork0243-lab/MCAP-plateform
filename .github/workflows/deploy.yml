name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        # The Next.js build alone can run past ssh-action's 10m default,
        # which killed the session mid-build and failed the job.
        command_timeout: 40m
        script: |
          set -e
          cd ~/mcap-platform
          git pull origin main
          sudo DOCKER_BUILDKIT=1 docker compose up -d --build
          # Old images and build cache otherwise fill the root volume,
          # which slows every later build down.
          sudo docker image prune -f
          sudo docker builder prune -f --keep-storage 5GB
          sudo docker compose ps
