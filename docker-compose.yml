version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to this file}
      POSTGRES_DB: ${POSTGRES_DB:-mcap_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: mcap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    # Built and pushed by CI; EC2 only pulls. `build` is kept so local
    # `docker compose up --build` still works for development.
    image: ghcr.io/businesswork0243-lab/mcap-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mcap_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    image: ghcr.io/businesswork0243-lab/mcap-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mcap_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mcap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mcap_db}
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:8000
      # Signing keys are read from .env and never committed. Compose fails
      # fast with the message below rather than starting on a known key.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env next to this file}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env next to this file}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RUN_WORKERS=true
      - WORKER_CONCURRENCY=1
      - LOG_LEVEL=info
      - AI_TIMEOUT_MS=180000
    depends_on:
      - postgres
      - redis

  ai-engine:
    image: ghcr.io/businesswork0243-lab/mcap-ai-engine:latest
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: mcap_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mcap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mcap_db}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-chat}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
